  <body>
    <div id="root"></div>
    <section class="proposal-ending" aria-label="집사인생 프로젝트 마무리">
      <img src="__PROJECT_01_ENDING__" width="1920" height="1080" alt="Thank you, 집사인생. 역할: 기획팀장 / 디자인 서브. 기간: 2026.04~2026.05. 툴: Figma, ChatGPT, Claud, Photoshop, Gemini. 기여도: 77%." />
    </section>
    <script>
      const reportNavVisibility = (hidden) => {
        window.parent.postMessage(
          { type: 'proposal-nav-visibility', hidden },
          window.parent.location.origin
        );
      };
      const scrollPositions = new WeakMap();
      // Track direction separately for the document and nested scroll containers.
      document.addEventListener('scroll', (event) => {
        const scroller = event.target === document ? document.scrollingElement : event.target;
        if (!scroller) return;
        const nextTop = Math.max(0, scroller.scrollTop ?? window.scrollY ?? 0);
        const previousTop = scrollPositions.get(scroller) ?? 0;
        scrollPositions.set(scroller, nextTop);
        if (nextTop === 0) reportNavVisibility(false);
        else if (nextTop !== previousTop) reportNavVisibility(nextTop > previousTop);
      }, { capture: true, passive: true });
      document.addEventListener('wheel', (event) => {
        if (event.deltaY !== 0) reportNavVisibility(event.deltaY > 0);
      }, { capture: true, passive: true });
      window.addEventListener('load', () => reportNavVisibility(window.scrollY > 8));

      const observer = new MutationObserver(() => {
        const cover = document.querySelector('.cover-figma');
        if (!cover) return;
        const link = document.createElement('a');
        link.className = 'proposal-app-link';
        link.href = 'https://new-jibsalife.vercel.app';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '앱 바로가기 ↗';
        cover.append(link);
        observer.disconnect();
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
