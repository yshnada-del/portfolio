<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMMONS Presentation</title>
    <script type="module" crossorigin src="/simmonspage/assets/index-CBzg5GGh.js"></script>
    <link rel="stylesheet" crossorigin href="/simmonspage/assets/index-CyNSiAq_.css">
    <style>
      .simmons-ending { margin: 0; padding: 0; background: #5d3136; }
      .simmons-ending img { display: block; width: 100%; height: auto; }
      .simmons-app-link {
        position: absolute;
        right: 7%;
        bottom: 7%;
        z-index: 2;
        display: block;
        width: clamp(200px, 20vw, 350px);
        background: transparent;
        font-family: inherit;
        text-decoration: none;
      }
      .simmons-app-link > svg { display: block; width: 100%; height: auto; overflow: visible; }
      .simmons-app-link .story-button-shape { fill: #fcf7e9; stroke: #5d3136; stroke-width: 1.5; }
      .simmons-app-link .story-button-ring { fill: #5d3136; stroke: #5d3136; stroke-width: 1.5; }
      .simmons-app-link .story-button-text { fill: #5d3136; font-size: 24px; font-weight: 400; }
      .simmons-app-link .story-button-arrow { fill: none; stroke: #fcf7e9; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .simmons-app-link .story-button-shape,
      .simmons-app-link .story-button-ring,
      .simmons-app-link .story-button-text,
      .simmons-app-link .story-button-arrow { transition: fill .35s ease, stroke .35s ease; }
      .simmons-app-link:hover .story-button-shape { fill: #5d3136; stroke: #fcf7e9; }
      .simmons-app-link:hover .story-button-ring { fill: #fcf7e9; stroke: #fcf7e9; }
      .simmons-app-link:hover .story-button-text { fill: #fcf7e9; }
      .simmons-app-link:hover .story-button-arrow { stroke: #5d3136; }
      .simmons-app-link:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
      @media (max-width: 760px) {
        .simmons-app-link { right: 6%; width: clamp(160px, 32vw, 230px); }
      }
    </style>
  </head>
  <body>

        cover.append(link);

      appLinkObserver.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
</html>
