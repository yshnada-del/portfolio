<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>맛과멋 | Style Based Place Curation</title>
    <script type="module" crossorigin src="/landingpage/assets/index-dMb_WznQ.js"></script>
    <link rel="stylesheet" crossorigin href="/landingpage/assets/index-D6fimJnJ.css">
    <style>
      @font-face {
        font-family: 'Portfolio Pretendard';
        src: url('__PRETENDARD_REGULAR__') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      /* Keep the phone pair together when the scaled iframe becomes taller. */
      @media (min-width: 1181px) {
        .hero__inner {
          top: 0;
          min-height: 0;
          height: auto;
          grid-template-rows: auto auto;
          align-content: center;
        }
        .hero__visual {
          align-self: start;
          height: 620px;
          min-height: 620px;
        }
        .hero__phone-image--left { top: 6%; bottom: auto; }
        .hero__phone-image--right { top: -6%; }
      }
      .closing-section__inner .matmut-project-meta {
        display: grid;
        justify-items: center;
        gap: 24px;
        width: min(100%, 560px);
        color: #fff;
        text-align: center;
      }
      .closing-section__inner .matmut-project-meta p {
        margin: 0;
        color: #fff;
        font-family: 'Portfolio Pretendard', sans-serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: 0;
        text-align: center;
        text-shadow: none;
        word-break: keep-all;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const matmutObserver = new MutationObserver(() => {
        const closing = document.querySelector('.closing-section__inner');
        if (closing && !closing.querySelector('.matmut-project-meta')) {
          const meta = document.createElement('div');
          meta.className = 'matmut-project-meta';
          meta.setAttribute('aria-label', '맛과멋 프로젝트 정보');
          meta.innerHTML = `
            <p>역할 : 기획 / 개발 / 디자인</p>
            <p>기간 : 2026.04 ~ 2026.05</p>
            <p>툴 : Figma / ChatGPT / Claude / Photoshop / Gemini / Illustrator / Midjourney / Codex / VS Code / GitHub / React / HTML / CSS / JavaScript</p>
            <p>기여도 : 100%</p>`;
          closing.append(meta);
        }
        if (closing) matmutObserver.disconnect();
      });
      matmutObserver.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
</html>
